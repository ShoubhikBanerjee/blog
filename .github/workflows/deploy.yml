name: Deploy to Github Pages

on:
    push:
        branches: [website]
    pull_request:
        branches: [website]

concurrency:
    group: github-pages-deploy
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest

        permissions:
            # Give the default GITHUB_TOKEN write permission to commit and push the
            # added or changed files to the repository.
            contents: write

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Cache Hugo resources
              uses: actions/cache@v4
              env:
                  cache-name: cache-hugo-resources
              with:
                  path: resources
                  key: ${{ env.cache-name }}

            - uses: actions/setup-go@v5
              with:
                  go-version: "^1.17.0"
            - run: go version

            - name: Setup Hugo
              uses: peaceiris/actions-hugo@v2
              with:
                  hugo-version: "latest"
                  extended: true

            - name: Install Dart Sass
              run: |
                curl -fsSL -o "${RUNNER_TEMP}/dart-sass.tar.gz" \
                  "https://github.com/sass/dart-sass/releases/download/1.105.0/dart-sass-1.105.0-linux-x64.tar.gz"
                tar -xzf "${RUNNER_TEMP}/dart-sass.tar.gz" -C "${RUNNER_TEMP}"
                echo "${RUNNER_TEMP}/dart-sass" >> "${GITHUB_PATH}"
                "${RUNNER_TEMP}/dart-sass/sass" --version

            - name: Build
              run: hugo --minify --gc

            - name: Deploy 🚀
              if: github.event_name == 'push'
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  branch: gh-pages
                  folder: public
                  clean: true
                  single-commit: true
